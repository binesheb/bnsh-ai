<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARIV Chat</title><link rel="stylesheet" href="styles.css"></head><body class="chat-page"><main class="chat-shell"><header><div><span class="eyebrow">BNSH AI · ARIV</span><h1>Chat</h1><p id="runtime">Runtime: checking...</p></div><a class="ghost" href="index.html">Dashboard</a></header><section id="messages" class="messages"><div class="message system">ARIV development runtime is available.</div></section><form id="chat"><input id="prompt" autocomplete="off" placeholder="Message ARIV..." required><button>Send</button></form></main><script>
const API="http://127.0.0.1:8790";let messages=[];
async function load(){let r=await fetch(API+"/api/runtime"),d=await r.json();if(!d.ready){await fetch(API+"/api/runtime/load",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model_id:"ariv-3b"})});r=await fetch(API+"/api/runtime");d=await r.json()}document.getElementById("runtime").textContent=d.ready?"Runtime: "+d.model_id+" · "+d.provider:"Runtime: not loaded"}
function render(){document.getElementById("messages").innerHTML=messages.map(m=>"<div class=\"message "+m.role+"\">"+m.content.replace(/</g,"&lt;")+"</div>").join("")}
document.getElementById("chat").onsubmit=async e=>{e.preventDefault();let i=document.getElementById("prompt"),t=i.value.trim();if(!t)return;messages.push({role:"user",content:t});i.value="";render();let r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:messages})}),d=await r.json();messages.push(d.message||{role:"assistant",content:d.error||"Request failed"});render()};load();
</script></body></html>
