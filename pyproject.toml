[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bnsh-ai"
version = "0.1.0a3"
description = "Open multilingual AI runtime and model tooling for BNSH AI."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Binesh E B"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
transformers = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.34",
]

[project.scripts]
bnsh = "bnsh.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["bnsh*"]
